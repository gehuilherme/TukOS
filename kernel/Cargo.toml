[package]
name = "tukos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tukos-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
arch-x86_64 = { path = "../crates/arch-x86_64" }
limine = "0.5"
mm = { path = "../crates/mm" }
kbd = { path = "../crates/kbd" }
gfx = { path = "../crates/gfx" }
pe = { path = "../crates/pe" }
spin = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"] }

[features]
ktest = []
ktest-panic = []
ktest-fault = []
ktest-backtrace = []
conformance = []
conformance32 = ["conformance"]
conformance_heap = ["conformance32"]
conformance_crt = ["conformance32"]
conformance_echo = ["conformance_crt"]
conformance_fileio = ["conformance_crt"]
conformance_spawn = ["conformance_crt"]
shell = ["conformance_crt"]
gui = ["conformance_crt"]
gui_type = ["gui"]
