[workspace]
resolver = "3"
members = ["xtask", "crates/arch-x86_64", "crates/mm", "crates/pe", "crates/kbd", "crates/ntdll", "crates/kernel32", "kernel"]
default-members = ["xtask", "crates/arch-x86_64", "crates/mm", "crates/pe", "crates/kbd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Required: the no_std ntdll cdylib cannot link with unwinding.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
