name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain
        run: rustup toolchain install
      - name: Cache do Limine
        uses: actions/cache@v4
        with:
          path: target/limine
          key: limine-${{ hashFiles('xtask/src/image.rs') }}
      - name: Testes do host
        run: cargo xtask test
      - name: Lint
        run: cargo clippy -p xtask -p arch-x86_64 -p mm -p pe -p kbd -p gfx -- -D warnings
      - name: Lint do kernel
        run: cargo clippy -p tukos-kernel --target x86_64-unknown-none --features ktest -- -D warnings
      - name: Autotestes do kernel no QEMU
        run: cargo xtask ktest

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Testes do host
        run: cargo xtask test
